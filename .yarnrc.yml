nodeLinker: node-modules

npmPublishRegistry: "https://registry.npmjs.org"

npmRegistryServer: "https://registry.npmjs.org"

yarnPath: .yarn/releases/yarn-4.18.1.cjs

# A version younger than a week is not installed: a hijacked release is usually pulled within days.
npmMinimalAgeGate: 7d

# webpack-dev-middleware below 7.4.5 (GHSA-g84c-rxfj-3j2c, path traversal in the dev server):
# Storybook 10 pins version 6 for `storybook dev`, which listens on localhost only. Drop the line
# when Storybook brings a fixed version.
npmAuditIgnoreAdvisories:
  - "1240027"

name: Publish pne-ui

on:
  push:
    tags:
      - 'npm/v*'
  # A tag push now and then creates no run at all (5.0.0-rc.0 and rc.1, 2026-11-05), and release
  # tags cannot be deleted or moved. Start such a run by hand: Actions, Publish pne-ui, Run workflow,
  # and pick the release tag (not a branch) under "Use workflow from". The validation rejects any
  # other ref. GitHub offers the button once this file is on the default branch.
  workflow_dispatch:

permissions: {}

# Never interrupt an active publication. Send one release at a time: GitHub
# concurrency keeps only one pending run and can replace it with a newer one.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build, check and pack
    if: github.repository == 'alcovp/pne-ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out release tag and branch history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up release runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Validate release tag
        run: node scripts/release-ci.mjs validate
      - name: Install dependencies
        run: node .yarn/releases/yarn-4.2.2.cjs install --immutable
      - name: Build, check and inspect release archive
        run: node .yarn/releases/yarn-4.2.2.cjs release:check
      - name: Upload checked archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-package
          path: |
            .release/*.tgz
            .release/release.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish checked archive through npm OIDC
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out validation scripts from the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            scripts
          # Cone mode also checks out root files (package.json and .nvmrc).
      - name: Set up release runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check that npm can publish through OIDC
        # Trusted publishing needs npm 11.5.1 or newer; npm itself comes with Node from .nvmrc.
        run: >-
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number);
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
          console.error(`npm ${process.argv[1]} cannot publish through OIDC; 11.5.1 or newer is required`);
          process.exit(1) }' "$(npm --version)"
      - name: Download checked archive from this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-package
          path: .release
      - name: Verify and publish the exact archive
        # Ends with `npm publish`. npm shows a trusted-publish version minutes later, so the job
        # does not wait for it; `yarn release:status` reads the registry afterwards.
        run: node scripts/release-ci.mjs publish

name: Publish pne-ui next 4.3.0-rc.53

on:
  push:
    branches:
      - ci/publish-next-4.3.0-rc.53

permissions:
  contents: read

concurrency:
  group: publish-pne-ui-next
  cancel-in-progress: false

jobs:
  publish-next:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the audited release commit
        uses: actions/checkout@v4
        with:
          ref: 0933a7fd8a56bcb5fdb608817f0636d46be25b5d

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          registry-url: https://registry.npmjs.org/

      - name: Enable the pinned Yarn version
        run: corepack enable

      - name: Verify the exact release
        run: node -e "const p = require('./package.json'); if (p.name !== 'pne-ui' || p.version !== '4.3.0-rc.53') process.exit(1)"

      - name: Verify the CI publishing credential is present
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error title=NPM_TOKEN missing::The repository has no usable NPM_TOKEN secret for remote publishing."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Publish only to the next tag
        run: |
          set +e
          publish_output="$(npm publish --ignore-scripts --access public --tag next 2>&1)"
          publish_status=$?
          set -e
          if [ "$publish_status" -ne 0 ]; then
            publish_code="$(printf '%s\n' "$publish_output" | sed -n 's/^npm error code \([A-Z0-9]*\)$/\1/p' | head -n 1)"
            case "$publish_code" in
              E401|E403|E404|ENEEDAUTH|EOTP) ;;
              *) publish_code="rejected" ;;
            esac
            echo "::error title=npm publish $publish_code::The NPM_TOKEN secret exists, but npm rejected the guarded next-tag publication."
            exit "$publish_status"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

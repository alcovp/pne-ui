name: Check pne-ui

# Every branch push and pull request gets the same build and checks as a release, without
# publication, and every story is opened in a browser. Release tags go through publish.yml instead.
on:
  push:
    branches:
      - '**'
  pull_request:

permissions: {}

# A newer push to the same ref makes the older check pointless.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and check
    if: github.repository == 'alcovp/pne-ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        run: node .yarn/releases/yarn-4.18.1.cjs install --immutable
      - name: Build and run every check
        run: node .yarn/releases/yarn-4.18.1.cjs check

  # Runs next to the checks above, so neither waits for the other. Chrome comes with the runner
  # image. Pictures are not compared here: that needs a baseline and is a local step.
  storybook:
    name: Open every story in a browser
    if: github.repository == 'alcovp/pne-ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        run: node .yarn/releases/yarn-4.18.1.cjs install --immutable
      - name: Build Storybook and open every story
        run: node .yarn/releases/yarn-4.18.1.cjs storybook:check --no-pictures
      - name: Upload the report of a failed check
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-check
          path: |
            node_modules/.cache/storybook-check/report.html
            node_modules/.cache/storybook-check/report.json
            node_modules/.cache/storybook-check/build-current.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

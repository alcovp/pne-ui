# GitHub reads this file from the default branch only.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'

  # Tools only. The libraries an application shares with pne-ui (the peer dependencies) are listed
  # in devDependencies too; their versions are a decision about the contract with the applications,
  # so they are updated by hand.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      tools:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '@emotion/*'
      - dependency-name: '@mui/*'
      - dependency-name: '@types/react'
      - dependency-name: '@types/react-dom'
      - dependency-name: dayjs
      - dependency-name: i18next
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-i18next
      # Stays 6 for the tools that need the compiler API until typescript-eslint accepts 7; the
      # compiler itself is the `typescript-7` entry.
      - dependency-name: typescript
